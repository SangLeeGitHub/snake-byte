<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Byte - Apple II Edition</title>
    <style>
        :root {
            --apple-green: #33ff00;
            --dark-green: #004400;
            --bg-color: #050a05;
        }

        body {
            background-color: #111;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: var(--apple-green);
            user-select: none;
        }

        /* CRT Monitor Effect */
        .crt-container {
            position: relative;
            width: 640px;
            max-width: 95vw;
            aspect-ratio: 4 / 3;
            background: var(--bg-color);
            border: 20px solid #333;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.1), inset 0 0 100px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0, 255, 0, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 11;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            filter: blur(0.5px) contrast(1.2);
        }

        /* Mobile Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            z-index: 20;
        }

        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(51, 255, 0, 0.2);
            border: 2px solid var(--apple-green);
            color: var(--apple-green);
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 10px;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: var(--apple-green);
            color: var(--bg-color);
        }

        #up { grid-column: 2; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }

        .hidden { display: none !important; }

        @media (min-width: 768px) {
            #controls { display: none; }
        }
    </style>
</head>
<body>

<div class="crt-container">
    <canvas id="gameCanvas"></canvas>
</div>

<div id="controls">
    <div class="ctrl-btn" id="up">▲</div>
    <div class="ctrl-btn" id="left">◀</div>
    <div class="ctrl-btn" id="down">▼</div>
    <div class="ctrl-btn" id="right">▶</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Resolution settings (Apple II style)
    const GRID_SIZE = 40; 
    const CELL_SIZE = 16; // virtual cell size
    canvas.width = GRID_SIZE * CELL_SIZE;
    canvas.height = Math.floor(GRID_SIZE * 0.6) * CELL_SIZE;

    const COLS = GRID_SIZE;
    const ROWS = Math.floor(canvas.height / CELL_SIZE);

    // Game State
    let state = 'START'; // START, PLAYING, GAME_OVER
    let score = 0;
    let lives = 3;
    let level = 1;
    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = null;
    let walls = [];
    let gameTick = 0;
    let speed = 8; // Higher is slower

    // Sound System
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type = 'square', duration = 0.1) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) { console.log("Audio error", e); }
    }

    // Level Data (Walls)
    const LEVELS = [
        [], // Lvl 1: Empty
        [ // Lvl 2: Simple barriers
            {x: 10, y: 5, w: 1, h: 10}, {x: 30, y: 10, w: 1, h: 10}
        ],
        [ // Lvl 3: Boxes
            {x: 10, y: 5, w: 20, h: 1}, {x: 10, y: 15, w: 20, h: 1},
            {x: 10, y: 5, w: 1, h: 11}, {x: 30, y: 5, w: 1, h: 11}
        ],
        [ // Lvl 4: Complex maze
            {x: 5, y: 5, w: 10, h: 1}, {x: 20, y: 10, w: 10, h: 1},
            {x: 30, y: 5, w: 5, h: 10}, {x: 15, y: 2, w: 1, h: 8}
        ]
    ];

    function initGame() {
        snake = [{ x: 10, y: 12 }, { x: 9, y: 12 }, { x: 8, y: 12 }];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        lives = 3;
        level = 1;
        loadLevel();
        state = 'PLAYING';
    }

    function loadLevel() {
        walls = [];
        const lvlIdx = Math.min(level - 1, LEVELS.length - 1);
        const data = LEVELS[lvlIdx];
        data.forEach(w => {
            for (let x = w.x; x < w.x + (w.w || 1); x++) {
                for (let y = w.y; y < w.y + (w.h || 1); y++) {
                    walls.push({ x, y });
                }
            }
        });
        spawnFood();
    }

    function spawnFood() {
        while (true) {
            const fx = Math.floor(Math.random() * COLS);
            const fy = Math.floor(Math.random() * ROWS);
            if (!walls.some(w => w.x === fx && w.y === fy) && 
                !snake.some(s => s.x === fx && s.y === fy)) {
                food = { x: fx, y: fy, val: Math.floor(Math.random() * 9) + 1 };
                break;
            }
        }
    }

    function update() {
        if (state !== 'PLAYING') return;

        gameTick++;
        if (gameTick % speed !== 0) return;

        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        // Wall collision
        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || 
            walls.some(w => w.x === head.x && w.y === head.y)) {
            handleCollision();
            return;
        }

        // Self collision
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            handleCollision();
            return;
        }

        snake.unshift(head);

        // Food eating
        if (head.x === food.x && head.y === food.y) {
            score += food.val * 10;
            playSound(440 + food.val * 50, 'square', 0.15);
            spawnFood();
            if (score > level * 200) {
                level++;
                playSound(880, 'sine', 0.3);
                loadLevel();
            }
        } else {
            snake.pop();
        }
    }

    function handleCollision() {
        playSound(150, 'sawtooth', 0.4);
        lives--;
        if (lives <= 0) {
            state = 'GAME_OVER';
        } else {
            // Reset position but keep score/level
            snake = [{ x: 10, y: 12 }, { x: 9, y: 12 }, { x: 8, y: 12 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
        }
    }

    function draw() {
        // 1. Background Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#050a05'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // UI text - Green
        ctx.fillStyle = '#33ff00';
        ctx.font = '20px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score.toString().padStart(5, '0')}`, 20, 30);
        ctx.textAlign = 'right';
        ctx.fillText(`LEVEL: ${level}`, canvas.width - 20, 30);
        ctx.textAlign = 'left';
        ctx.fillText(`LIVES: ${'♥'.repeat(lives)}`, 20, canvas.height - 20);

        // Draw Walls - Green Outline
        ctx.strokeStyle = '#33ff00';
        ctx.lineWidth = 2;
        walls.forEach(w => {
            ctx.strokeRect(w.x * CELL_SIZE + 1, w.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        });

        // Draw Food - Green Text
        if (food) {
            ctx.fillStyle = '#33ff00';
            ctx.font = 'bold 16px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.val, food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Draw Snake - Green Fill/Stroke
        snake.forEach((s, i) => {
            if (i === 0) {
                ctx.fillStyle = '#33ff00';
                ctx.fillRect(s.x * CELL_SIZE + 2, s.y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
            } else {
                ctx.strokeStyle = '#33ff00';
                ctx.strokeRect(s.x * CELL_SIZE + 3, s.y * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6);
            }
        });

        if (state === 'START') {
            ctx.fillStyle = 'rgba(0, 20, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#33ff00';
            ctx.font = '40px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('SNAKE BYTE', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '20px "Courier New"';
            ctx.fillText('Press ANY KEY to Start', canvas.width / 2, canvas.height / 2 + 30);
        }

        if (state === 'GAME_OVER') {
            ctx.fillStyle = 'rgba(0, 20, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#33ff00';
            ctx.font = '40px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '20px "Courier New"';
            ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText('Press ANY KEY to Restart', canvas.width / 2, canvas.height / 2 + 60);
        }
    }

    function loop() {

        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Inputs
    window.addEventListener('keydown', e => {
        if (state !== 'PLAYING') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            initGame();
            return;
        }
        switch(e.key) {
            case 'ArrowUp': if (direction.y === 0) nextDirection = { x: 0, y: -1 }; break;
            case 'ArrowDown': if (direction.y === 0) nextDirection = { x: 0, y: 1 }; break;
            case 'ArrowLeft': if (direction.x === 0) nextDirection = { x: -1, y: 0 }; break;
            case 'ArrowRight': if (direction.x === 0) nextDirection = { x: 1, y: 0 }; break;
        }
    });

    // Mobile Buttons
    document.getElementById('up').onclick = () => { 
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(state==='PLAYING' && direction.y===0) nextDirection={x:0, y:-1}; else if(state!=='PLAYING') initGame(); 
    };
    document.getElementById('down').onclick = () => { 
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(state==='PLAYING' && direction.y===0) nextDirection={x:0, y:1}; else if(state!=='PLAYING') initGame(); 
    };
    document.getElementById('left').onclick = () => { 
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(state==='PLAYING' && direction.x===0) nextDirection={x:-1, y:0}; else if(state!=='PLAYING') initGame(); 
    };
    document.getElementById('right').onclick = () => { 
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(state==='PLAYING' && direction.x===0) nextDirection={x:1, y:0}; else if(state!=='PLAYING') initGame(); 
    };

    // Swipe Support
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    window.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (Math.abs(dx) > 30 && direction.x === 0) nextDirection = { x: dx > 0 ? 1 : -1, y: 0 };
        } else {
            if (Math.abs(dy) > 30 && direction.y === 0) nextDirection = { x: 0, y: dy > 0 ? 1 : -1 };
        }
    }, {passive: true});

    loop();
</script>
</body>
</html>
